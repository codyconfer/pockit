name: Package host integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build, vet, test, race-test, and install all package hosts
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --progress=plain \
            -f integration/Dockerfile -t pockit-integration . \
            2>&1 | tee docker-build.log
      - name: Exercise installed packages without network or credentials
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL \
            --security-opt no-new-privileges pockit-integration \
            2>&1 | tee package-integration.log
      - name: Save integration logs
        if: always()
        # v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package-integration-logs
          path: |
            docker-build.log
            package-integration.log
          if-no-files-found: ignore
          retention-days: 7
